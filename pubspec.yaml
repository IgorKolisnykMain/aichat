name: aichat
description: "A pet project with riverpod arch + firebase auth and firestore"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

  # State Management
  flutter_bloc: ^8.1.3
  bloc_concurrency: ^0.2.2
  flutter_riverpod: 3.0.0-dev.16

  # Dependency Injection
  get_it: ^7.6.0
  injectable: ^2.3.2

  # Navigation
  go_router: ^10.1.2

  # Firebase
  firebase_core: 3.8.1
  firebase_auth: 5.3.4
  cloud_firestore: 5.5.1
  firebase_storage: 12.3.6
  firebase_crashlytics: 4.2.0
  firebase_app_check: 0.3.1+7

  # Auth
  google_sign_in: 6.1.0
  sign_in_with_apple: 6.1.1

  # UI
  flutter_screenutil: ^5.8.4
  flutter_svg: 2.0.16

  # Other
  purchases_flutter: 8.10.2
  connectivity_plus: 6.1.3
  chat_gpt_sdk: 3.1.5
  rxdart: 0.28.0
  equatable: 2.0.7
  freezed_annotation: 2.4.4
  package_info_plus: ^4.2.0
  envied: 1.1.1
  collection: ^1.19.1

dev_dependencies:
  build_runner: ^2.4.6
  envied_generator: ^1.1.1
  flutter_gen_runner: ^5.3.1
  flutter_launcher_icons: 0.14.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.3.4
  injectable_generator: ^2.4.1
  json_serializable: ^6.7.1
  lint: ^2.1.2

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/ic_launcher/
    - assets/icons/
    - assets/images/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 800
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700


flutter_gen:
  output: lib/generated/
  line_length: 120
  # integrations:
  #   flutter_svg: true

